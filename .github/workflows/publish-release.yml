# Publishes a release once its pull request is merged, in a straight line: build every package in
# ci/release/packages from the merged commit and publish it to GitHub Packages, then tag `vX.Y.Z` and
# write the GitHub Release. The Voir handbook `github-release-workflow` is the contract this follows.
#
# Nothing is verified again here. The release pull request is where that happens: Verify tests it and
# `Build release artifacts` builds every package at the proposed version, and the ruleset on main
# will not merge it otherwise.
#
# The tag comes after the packages, because it is what marks a release complete: a release whose
# packages did not all make it has no tag, and rerunning the workflow carries on from there. A
# package already published from the same source is not published again, and a tag already at the
# merged commit is kept.
name: Publish Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

# One publication at a time, and never cancelled halfway for a newer one.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    # The iOS libraries among the packages can only be built on macOS.
    runs-on: macos-latest
    timeout-minutes: 45
    # Required reviewers on this environment, when it has any, are the last human gate before
    # anything is published. Without them it passes straight through.
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      # Every commit and tag: detect looks for the release tag, and publication compares a POM
      # already published with the commit it names.
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: ci/release/detect

      - name: Set up Java 21
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # No cache: what is published is built from the merged source and nothing else.
      - name: Set up Gradle
        if: steps.release.outputs.should_publish == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build every release package
        if: steps.release.outputs.should_publish == 'true'
        env:
          RELEASE_REVISION: ${{ github.event.pull_request.merge_commit_sha }}
        run: ci/release/build-packages

      - name: Check the packages against the release
        if: steps.release.outputs.should_publish == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: ci/release/check-packages

      - name: Publish every package
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_gitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gitHubPackagesPassword: ${{ github.token }}
        run: ci/release/publish-packages

  release:
    name: Create tag and GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: ci/release/finalize
