# Whether a pull request is safe to merge. Everything the repository builds is checked through
# `ci/verify`, the same command a developer runs locally. The Voir handbook `github-verify-workflow`
# is the contract this follows.
#
# Two halves, side by side, because no single runner can do both: Linux has Docker for the
# Testcontainers tests and skips the Apple targets, macOS builds the Apple targets and has no Docker.
# The job a ruleset requires is the gate at the end, `Build and check whole repository`, whose name
# never changes when the jobs behind it do.
#
# `[skip verify]` in the pull-request body skips every job, the gate included, which GitHub counts
# as a pass. It is a reviewer's decision made in the open; removing it runs everything again, since
# editing the body is one of the triggers.
#
# A release pull request — `release/vX.Y.Z`, opened by Prepare Release — also runs `Build release
# artifacts` once the gate passes: every package in ci/release/packages built at the proposed version
# into a local Maven repository, to prove the release can be produced before it is merged. Nothing is
# published from here; Publish Release builds the packages again from the merged commit and
# publishes those.
name: Verify

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle build and tests
    if: ${{ !contains(github.event.pull_request.body || '', '[skip verify]') }}
    runs-on: ubuntu-latest
    # Testcontainers starts PostgreSQL for server-sdk and the reference host, and the build covers
    # JVM and Android besides; well inside this on a cold cache.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify the Gradle build
        run: ci/verify

      - name: Keep test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  apple:
    name: Apple targets
    if: ${{ !contains(github.event.pull_request.body || '', '[skip verify]') }}
    runs-on: macos-latest
    # Kotlin/Native downloads its toolchain on a cold cache and links a test binary per module.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify the Apple targets
        run: ci/verify apple

      - name: Keep test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  verify:
    name: Build and check whole repository
    needs:
      - gradle
      - apple
    # always(), so a failed job still reaches this gate and fails it, rather than leaving the
    # required check skipped — which GitHub would count as a pass.
    if: ${{ always() && !contains(github.event.pull_request.body || '', '[skip verify]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to have passed
        env:
          GRADLE: ${{ needs.gradle.result }}
          APPLE: ${{ needs.apple.result }}
        run: |
          set -euo pipefail
          echo "Gradle build and tests: $GRADLE"
          echo "Apple targets:          $APPLE"
          if [ "$GRADLE" != "success" ] || [ "$APPLE" != "success" ]; then
            echo "::error::Verification did not pass"
            exit 1
          fi

  release-artifacts:
    name: Build release artifacts
    needs: verify
    # Only a release branch of this repository. Skipped with the rest by `[skip verify]`.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.body || '', '[skip verify]')
    # The iOS libraries among the packages can only be built here.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # The pull request merged into its base, as the jobs above tested it — the tree a merge would
      # make.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the release is consistent
        env:
          EXPECTED_VERSION: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${EXPECTED_VERSION#release/}" ci/release/validate

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Publishes nothing: this job has no credential that could.
      - name: Build every release package
        env:
          RELEASE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: ci/release/build-packages

      - name: Check the packages against the release
        env:
          EXPECTED_VERSION: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${EXPECTED_VERSION#release/v}" ci/release/check-packages
