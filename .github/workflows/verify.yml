# Whether a pull request is safe to merge: the whole Gradle build with its container-backed tests,
# through `ci/verify`, the same command a developer runs locally. The Voir handbook
# `github-verify-workflow` is the contract this follows.
#
# It runs on Linux, where Docker is available for the Testcontainers tests and Kotlin skips the
# Apple targets. Those are built only for a release, on macOS, whose runners cost ten times as much
# and cannot run the server tests anyway: see `Build release artifacts` below.
#
# `[skip verify]` in the pull-request body skips every job, which GitHub counts as a pass. It is a
# reviewer's decision made in the open; removing it runs everything again, since editing the body is
# one of the triggers.
#
# A release pull request — `release/vX.Y.Z`, opened by Prepare Release — also runs `Build release
# artifacts` once the build passes: the Apple targets compiled and tested, and every package in
# ci/release/packages built at the proposed version into a local Maven repository, kept as this
# run's `release-packages`. Nothing is published from here. When the merged commit has the tree this
# run checked, Publish Release takes that as its verification rather than running it all again.
name: Verify

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and check whole repository
    if: ${{ !contains(github.event.pull_request.body || '', '[skip verify]') }}
    runs-on: ubuntu-latest
    # Testcontainers starts PostgreSQL for server-sdk and the reference host, and the build covers
    # JVM and Android besides; well inside this on a cold cache.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ci/verify

      - name: Keep test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  release-artifacts:
    name: Build release artifacts
    needs: verify
    # Only a release branch of this repository. Skipped with the rest by `[skip verify]`, in which
    # case publication verifies the merged commit itself.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.body || '', '[skip verify]')
    # The iOS libraries can only be built here, and their simulator tests only run here.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # The pull request merged into its base, as the Linux job tested it — the tree a merge would
      # make. Publication counts this run as its verification only if the merged commit has exactly
      # this tree.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the release is consistent
        env:
          EXPECTED_VERSION: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${EXPECTED_VERSION#release/}" ci/release/validate

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify the Apple targets
        run: ci/verify apple

      # Publishes nothing: this job has no credential that could.
      - name: Build every release package
        env:
          RELEASE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: ci/release/build-packages

      - name: Check the packages against the release
        env:
          EXPECTED_VERSION: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${EXPECTED_VERSION#release/v}" ci/release/check-packages

      - name: Keep the release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/release/
          # Long enough for a release pull request to be reviewed. One merged later is verified
          # again from the merged commit instead.
          retention-days: 14
          if-no-files-found: error

      - name: Keep test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
